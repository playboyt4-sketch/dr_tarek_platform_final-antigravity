name: dr_tarek_platform
description: "Dr. Tarek Platform - Educational Learning Management Platform."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  # PINNED 4.13.0 (was ^4.13.0): firebase_auth 6.5.7's Android code reads
  # FlutterFirebaseCorePlugin.customAuthDomain, which exists only in core
  # 4.13.0 — core 4.14.0 moved it (Kotlin rewrite) and breaks the Android
  # release build. Revert to ^ only after auth+core native pairing is verified.
  firebase_core: 4.13.0
  firebase_auth: ^6.5.7
  cloud_functions: ^6.3.6
  cloud_firestore: ^6.8.0
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  flutter_secure_storage: ^11.0.0
  file_picker: ^12.0.0
  image_picker: ^1.2.3
  firebase_storage: ^13.4.6
  video_player: ^2.14.0
  # Web-only HLS backend for video_player (federated web implementation).
  # Activates ONLY for .m3u8 URLs on Flutter Web: attaches the hls.js
  # global (loaded in web/index.html) to the plugin-owned <video> element
  # and feeds it the signed playlist URL unmodified. Non-HLS URLs fall
  # through to the stock video_player_web path; mobile is untouched
  # (this package contains no Android/iOS code).
  video_player_web_hls: ^1.3.0
  # Direct reference: the Web HLS backend installer assigns
  # VideoPlayerPlatform.instance explicitly (see core/web/).
  video_player_platform_interface: ^6.9.0
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.4
  uuid: ^4.5.1
  crypto: ^3.0.0
  path: ^1.9.0
  chewie: ^1.15.0
  flutter_cached_pdfview: ^0.4.4
  url_launcher: ^6.3.1
  screen_brightness: ^2.1.11
  volume_controller: 3.0.0
  lucide_icons: ^0.257.0
  cryptography: ^2.5.0
  path_provider: ^2.1.2
  firebase_crashlytics: ^5.0.0
  firebase_messaging: ^16.1.1
  # PINNED 0.4.6 (was ^0.4.7): 0.4.7 requires firebase_core ^4.14.0 (see
  # firebase_core pin above); 0.4.6 accepts ^4.13.0 with the identical
  # activate(providerWeb:) API used in lib/main.dart.
  firebase_app_check: 0.4.6
  flutter_local_notifications: ^19.0.0
  state_notifier: ^1.0.0
  go_router: ^18.0.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icon/app-icon-1024.png
  fonts:
    - family: Gardenia Summer
      fonts:
        - asset: assets/fonts/Gardenia Summer.ttf
    - family: Google Sans Flex
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf
