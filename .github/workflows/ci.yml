name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-analyze-test:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter analyze (must be clean)
        run: flutter analyze --fatal-infos
      - name: flutter test
        run: flutter test

  android-release-build:
    name: Android release build validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Release build validates compile + manifest merge + R8 config.
      # Without key.properties this falls back to debug signing locally in
      # Gradle — acceptable for CI compile validation only (never shipped).
      - run: flutter build apk --release

  web-build:
    name: Web release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release

  cloud-functions:
    name: Cloud Functions lint + build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm test

  firestore-storage-rules:
    name: Firestore & Storage rules tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install rules test deps
        working-directory: security-tests
        run: npm install
      - name: Run rules unit tests against emulators
        working-directory: security-tests
        # Java is preinstalled on GitHub runners (required by Firestore emulator).
        run: firebase emulators:exec --only firestore,storage --project dr-tarek-platform-emulator "npm test"
