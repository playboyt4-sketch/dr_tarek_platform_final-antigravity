name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-analyze-test:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter analyze (must be clean)
        run: flutter analyze --fatal-infos
      - name: flutter test
        run: flutter test

  android-release-build:
    name: Android release build validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Release build validates compile + manifest merge + R8 config.
      # Without key.properties this falls back to debug signing locally in
      # Gradle — acceptable for CI compile validation only (never shipped).
      - run: flutter build apk --release

  web-build:
    name: Web release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Main Web release boot requires the App Check reCAPTCHA site key
      # (lib/main.dart guard). Injected from the GitHub secret
      # RECAPTCHA_SITE_KEY (value = "Dr Tarek Platform Web" site key,
      # created once by the Project Owner, never committed).
      - run: flutter build web --release --dart-define=RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }}

  cloud-functions:
    name: Cloud Functions lint + build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # firebase-tools is not preinstalled on ubuntu runners, but
      # `npm test` invokes `firebase emulators:exec`, so install the
      # CLI first (major-pinned for deterministic builds).
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm test

  firestore-storage-rules:
    name: Firestore & Storage rules tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Same as above: the emulator step needs the `firebase` command,
      # which ubuntu runners do not preinstall.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15
      - name: Install rules test deps
        working-directory: security-tests
        run: npm install
      - name: Run rules unit tests against emulators
        working-directory: security-tests
        # Java is preinstalled on GitHub runners (required by Firestore emulator).
        run: firebase emulators:exec --only firestore,storage --project dr-tarek-platform-emulator "npm test"
