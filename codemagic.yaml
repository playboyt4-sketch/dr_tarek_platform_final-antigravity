# codemagic.yaml - Dr. Tarek Platform (iOS Staging)
#
# Purpose: build the Flutter iOS app in Codemagic's macOS cloud so it can be
# validated (and, once Apple signing credentials exist, signed for personal
# device install and TestFlight beta distribution).
#
# Safety / scope rules (see docs/IOS_TESTFLIGHT_RUNBOOK.md,
# docs/IOS_STAGING_ENVIRONMENT_PLAN.md, docs/IOS_RELEASE_DECISION_REGISTER.md):
#   * Staging by default. Staging iOS builds pass `--dart-define=ENV=staging`
#     so the app boots against the isolated Firebase project
#     `dr-tarek-staging`.
#   * Production is selected ONLY by the explicit `ios-production-testflight`
#     workflow. It was added on 2026-10-31 on the Platform Owner's instruction
#     so real students can beta-test the pre-release build with their real
#     production accounts (the staging project is intentionally empty and
#     cannot authenticate them). It is manual-trigger only and never runs
#     automatically. Staging workflows are unchanged.
#   * Manual trigger only. No `triggering:` block is defined, so a git push can
#     never publish, sign, or distribute a build automatically.
#   * The signed IPA is an App Store distribution build. Uploading to App Store
#     Connect publishes to TestFlight, submits the build to TestFlight beta
#     review, and assigns the external group "Dr Tarek External Testers"; the
#     app is never submitted to App Store release review.
#   * No secrets are stored in this repository. Signing credentials come from
#     Codemagic secure environment variables / Code signing identities only.
#
# Flutter 3.44 uses Swift Package Manager by default for iOS dependencies, so
# the project's Xcode SPM integration (FlutterGeneratedPluginSwiftPackage) is
# used; CocoaPods remains available as a fallback for plugins that need it.
# The iOS deployment target is 15.0 because the Firebase Apple SDK 12.17 pinned
# by firebase_core 4.13.0 (and all Firebase plugins here) requires iOS 15.0.

workflows:
  # ---------------------------------------------------------------------------
  # 1) Unsigned build-validation workflow.
  #    Runs with no Apple credentials and always produces an artifact.
  # ---------------------------------------------------------------------------
  ios-staging-validation:
    name: iOS Staging - build validation (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      flutter: 3.44.4
      xcode: 26.6
      cocoapods: default
      vars:
        ENV: staging
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.swiftpm
        - $HOME/Library/Caches/org.swift.swiftpm
    scripts:
      - name: Record toolchain versions
        script: |
          set -e
          flutter --version
          dart --version
          xcodebuild -version || true
          which pod && pod --version || true
      - name: Resolve Flutter dependencies (SwiftPM enabled)
        script: |
          set -e
          flutter config --enable-swift-package-manager
          flutter pub get
      - name: Static analysis (errors fatal; infos/warnings reported)
        script: |
          set -e
          flutter analyze lib test --no-fatal-infos --no-fatal-warnings
      - name: Unit tests (core + push registration policy)
        script: |
          set -e
          flutter test test/core test/notifications
      - name: Build iOS archive for staging (unsigned)
        script: |
          set -e
          flutter build ipa --release --no-codesign --dart-define=ENV=staging
    artifacts:
      - build/ios/archive/*.xcarchive
      - build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log

  # ---------------------------------------------------------------------------
  # 2) Signed iOS workflow for TestFlight / personal-device install.
  #
  #    Uses Codemagic AUTOMATIC code signing: with the App Store Connect API key
  #    exposed by the `appstore_credentials` environment variable group, the App
  #    Store Connect CLI fetches (or creates) the Apple Distribution certificate
  #    and the App Store provisioning profile for `com.drtarek.platform` at build
  #    time. No signing material is stored in this repository.
  #
  #    Required Codemagic environment variable group `appstore_credentials`
  #    (Team settings > Environment variables, each marked Secret):
  #      APP_STORE_CONNECT_ISSUER_ID     - Issuer ID from App Store Connect >
  #                                        Users and Access > Integrations >
  #                                        App Store Connect API
  #      APP_STORE_CONNECT_KEY_IDENTIFIER- the API key's Key ID
  #      APP_STORE_CONNECT_PRIVATE_KEY   - contents of the downloaded
  #                                        AuthKey_XXXXXXXXXX.p8 file
  #      CERTIFICATE_PRIVATE_KEY         - an RSA private key Codemagic uses to
  #                                        create the distribution certificate
  #
  #    Until that group exists this workflow fails at the signing step; that is
  #    expected and is why it is a separate, manually-selected workflow. It does
  #    NOT submit the app to App Store release review.
  #
  #    Publishing behaviour: `submit_to_testflight: true` uploads the IPA and
  #    submits the processed build to TestFlight *beta* review (required before
  #    external testers can install it). `beta_groups` then grants the named
  #    external group access once Apple finishes review. Both actions run in
  #    Codemagic's post-processing step, after the macOS build has finished.
  # ---------------------------------------------------------------------------
  ios-staging-testflight:
    name: iOS Staging - signed IPA + TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: 3.44.4
      xcode: 26.6
      cocoapods: default
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: com.drtarek.platform
        ENV: staging
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.swiftpm
        - $HOME/Library/Caches/org.swift.swiftpm
    scripts:
      - name: Record toolchain versions
        script: |
          set -e
          flutter --version
          xcodebuild -version || true
      - name: Resolve Flutter dependencies (SwiftPM enabled)
        script: |
          set -e
          flutter config --enable-swift-package-manager
          flutter pub get
      - name: Static analysis (errors fatal; infos/warnings reported)
        script: |
          set -e
          flutter analyze lib test --no-fatal-infos --no-fatal-warnings
      - name: Unit tests (core + push registration policy)
        script: |
          set -e
          flutter test test/core test/notifications
      - name: Set up keychain for code signing
        script: keychain initialize
      - name: Fetch or create signing files (App Store distribution)
        script: |
          set -e
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Add signing certificate to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build signed IPA for staging (App Store distribution)
        script: |
          set -e
          flutter build ipa --release \
            --dart-define=ENV=staging \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - $HOME/export_options.plist
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # Upload the IPA, then submit the processed build to TestFlight beta
        # review. This is what makes a build installable by external testers.
        submit_to_testflight: true
        # External TestFlight group that receives the build after beta review.
        # Name must match App Store Connect exactly.
        beta_groups:
          - Dr Tarek External Testers

  # ---------------------------------------------------------------------------
  # 3) Production TestFlight for REAL students (owner-approved 2026-10-31).
  #
  #    Purpose: the Platform Owner runs pre-release testing with real students,
  #    so the beta build must authenticate them against PRODUCTION
  #    (`dr-tarek-platform`). The staging project is intentionally empty, which
  #    is why a staging TestFlight build can never log a real student in.
  #
  #    Scope / safety:
  #      * Manual trigger only (no `triggering:` block) — a push can never
  #        publish a production build.
  #      * `ENV=prod` is passed explicitly; `Environment.resolve()` fails closed
  #        on a missing/invalid value, so a misconfigured build cannot silently
  #        boot against the wrong project.
  #      * Staging workflows above are untouched and remain the default for
  #        routine QA.
  #      * Same bundle id, same App Store Connect record, same external
  #        TestFlight group as the staging workflow.
  #
  #    Build number: uses the UTC epoch (monotonic, 10 digits) so a new upload
  #    is never rejected as a duplicate of a previously uploaded build.
  # ---------------------------------------------------------------------------
  ios-production-testflight:
    name: iOS Production - signed IPA + TestFlight (real students)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: 3.44.4
      xcode: 26.6
      cocoapods: default
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: com.drtarek.platform
        ENV: prod
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.swiftpm
        - $HOME/Library/Caches/org.swift.swiftpm
    scripts:
      - name: Record toolchain versions
        script: |
          set -e
          flutter --version
          xcodebuild -version || true
      - name: Resolve Flutter dependencies (SwiftPM enabled)
        script: |
          set -e
          flutter config --enable-swift-package-manager
          flutter pub get
      - name: Static analysis (errors fatal; infos/warnings reported)
        script: |
          set -e
          flutter analyze lib test --no-fatal-infos --no-fatal-warnings
      - name: Unit tests (core + push registration policy)
        script: |
          set -e
          flutter test test/core test/notifications
      - name: Set up keychain for code signing
        script: keychain initialize
      - name: Fetch or create signing files (App Store distribution)
        script: |
          set -e
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Add signing certificate to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build signed IPA for production (App Store distribution)
        script: |
          set -e
          BUILD_NUMBER_ARG="$(date -u +%s)"
          echo "Production TestFlight build number: $BUILD_NUMBER_ARG"
          flutter build ipa --release \
            --dart-define=ENV=prod \
            --build-number="$BUILD_NUMBER_ARG" \
            --export-options-plist=$HOME/export_options.plist
      # Option A guard (owner-approved): a TestFlight/App Store archive must be
      # signed with `aps-environment=production`. The App Store provisioning
      # profile carries that value, but this asserts the *signed archive* rather
      # than trusting the profile, and stops the workflow before publishing if
      # the entitlement is missing or still `development` (sandbox APNs).
      # It changes no signing semantics - it only verifies the result.
      - name: Verify production APNs entitlement
        script: |
          set -e
          APP="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          ENT_PLIST="$(mktemp)"
          if [ ! -d "$APP" ]; then
            echo "ERROR: archived app not found at $APP"
            exit 1
          fi
          codesign -d --entitlements :- "$APP" > "$ENT_PLIST" 2>/dev/null || true
          if ! plutil -lint "$ENT_PLIST" >/dev/null 2>&1; then
            # Older codesign builds emit the plist on stderr instead of stdout.
            codesign -d --entitlements :- "$APP" 2>&1 | sed -n '/<?xml/,/<\/plist>/p' > "$ENT_PLIST"
          fi
          if [ ! -s "$ENT_PLIST" ] || ! plutil -lint "$ENT_PLIST" >/dev/null 2>&1; then
            echo "ERROR: could not extract a valid entitlements plist from the signed app."
            exit 1
          fi
          APS="$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$ENT_PLIST" 2>/dev/null || true)"
          echo "Signed archive aps-environment: '${APS:-<missing>}'"
          if [ -z "$APS" ]; then
            echo "ERROR: aps-environment is MISSING from the signed archive; the app cannot register with APNs."
            echo "--- signed entitlements ---"
            cat "$ENT_PLIST"
            exit 1
          fi
          if [ "$APS" != "production" ]; then
            echo "ERROR: aps-environment is '$APS' but a TestFlight/App Store archive MUST be 'production'."
            echo "Sandbox (development) tokens are not delivered to TestFlight/App Store installs."
            echo "--- signed entitlements ---"
            cat "$ENT_PLIST"
            exit 1
          fi
          echo "OK: signed archive carries aps-environment=production."
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - $HOME/export_options.plist
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Dr Tarek External Testers
